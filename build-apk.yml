name: Build ARSAM APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "debug or release"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main, master ]
    paths:
      - 'app/**'
      - 'engine/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.5 || true
          fi
          chmod +x gradlew || true

      - name: Decode release keystore (release only)
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ARSAM_KEYSTORE_BASE64: ${{ secrets.ARSAM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ARSAM_KEYSTORE_BASE64}" ]; then
            echo "::error::Missing ARSAM_KEYSTORE_BASE64 — see SIGNING.md"
            exit 1
          fi
          echo "$ARSAM_KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/arsam-release.jks"
          echo "ARSAM_KEYSTORE_PATH=$GITHUB_WORKSPACE/arsam-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleDebug --no-daemon --stacktrace
          else gradle assembleDebug --no-daemon --stacktrace; fi

      - name: Build signed release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        env:
          ARSAM_KEYSTORE_PASSWORD: ${{ secrets.ARSAM_KEYSTORE_PASSWORD }}
          ARSAM_KEY_ALIAS: ${{ secrets.ARSAM_KEY_ALIAS }}
          ARSAM_KEY_PASSWORD: ${{ secrets.ARSAM_KEY_PASSWORD }}
        run: |
          if [ -x ./gradlew ]; then ./gradlew assembleRelease --no-daemon --stacktrace
          else gradle assembleRelease --no-daemon --stacktrace; fi

      - name: Upload debug APK
        if: ${{ github.event.inputs.build_type != 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARSAM-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload release APK
        if: ${{ github.event.inputs.build_type == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ARSAM-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Cleanup keystore
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/arsam-release.jks"
